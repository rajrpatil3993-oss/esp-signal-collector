<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESP Signal Dashboard</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --primary: #38bdf8;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: linear-gradient(135deg, #020817, var(--bg));
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 20px 60px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
      }

      .status {
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.4);
        color: #bbf7d0;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.9rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-bottom: 24px;
      }

      .card {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .card .label {
        color: var(--muted);
        font-size: 0.8rem;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .value {
        font-size: 2rem;
        font-weight: 700;
      }

      .value.small {
        font-size: 1.4rem;
      }

      .chart-box {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 20px;
      }

      canvas {
        width: 100%;
        height: 260px;
        background: rgba(15, 23, 42, 0.8);
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.15);
      }

      .table-wrap {
        margin-top: 24px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(17, 24, 39, 0.9);
        border-radius: 12px;
        overflow: hidden;
      }

      th, td {
        padding: 12px 14px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
        text-align: left;
      }

      th {
        color: var(--muted);
        background: rgba(31, 41, 55, 0.8);
      }

      .good { color: var(--success); }
      .warn { color: var(--warning); }
      .bad { color: var(--danger); }

      @media (max-width: 600px) {
        h1 { font-size: 1.5rem; }
        .value { font-size: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>ESP Signal Dashboard</h1>
        <div id="status" class="status">Connecting...</div>
      </header>

      <section class="grid">
        <div class="card">
          <div class="label">Temperature</div>
          <div id="temperature" class="value">--°C</div>
        </div>

        <div class="card">
          <div class="label">Humidity</div>
          <div id="humidity" class="value">--%</div>
        </div>

        <div class="card">
          <div class="label">Signal Strength</div>
          <div id="signal" class="value">-- dBm</div>
        </div>

        <div class="card">
          <div class="label">Device Status</div>
          <div id="deviceStatus" class="value small">Waiting</div>
        </div>
      </section>

      <div class="chart-box">
        <canvas id="signalChart" width="1000" height="260"></canvas>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Temperature</th>
              <th>Humidity</th>
              <th>Signal</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="dataTable"></tbody>
        </table>
      </div>
    </div>

    <script>
      const statusEl = document.getElementById('status');
      const temperatureEl = document.getElementById('temperature');
      const humidityEl = document.getElementById('humidity');
      const signalEl = document.getElementById('signal');
      const deviceStatusEl = document.getElementById('deviceStatus');
      const tableBody = document.getElementById('dataTable');
      const canvas = document.getElementById('signalChart');
      const ctx = canvas.getContext('2d');

      const history = [];
      let ws;

      function setConnectionState(isConnected) {
        statusEl.textContent = isConnected ? 'Live data connected' : 'Disconnected';
        statusEl.style.background = isConnected
          ? 'rgba(34, 197, 94, 0.1)'
          : 'rgba(239, 68, 68, 0.08)';
        statusEl.style.borderColor = isConnected
          ? 'rgba(34, 197, 94, 0.4)'
          : 'rgba(239, 68, 68, 0.4)';
        statusEl.style.color = isConnected ? '#bbf7d0' : '#fecaca';
      }

      function drawChart() {
        const width = canvas.width;
        const height = canvas.height;
        ctx.clearRect(0, 0, width, height);

        ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
        ctx.lineWidth = 1;

        for (let i = 0; i <= 5; i++) {
          const y = (height / 5) * i;
          ctx.beginPath();
          ctx.moveTo(40, y);
          ctx.lineTo(width - 20, y);
          ctx.stroke();
        }

        if (history.length < 2) {
          return;
        }

        const values = history.map(item => item.signal);
        const min = Math.min(...values) - 5;
        const max = Math.max(...values) + 5;

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();

        history.forEach((point, index) => {
          const x = 40 + (index / Math.max(history.length - 1, 1)) * (width - 60);
          const y = height - 20 - ((point.signal - min) / Math.max(max - min, 1)) * (height - 40);

          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });

        ctx.stroke();
      }

      function renderTable() {
        tableBody.innerHTML = '';
        [...history].slice(-8).reverse().forEach(item => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${item.time}</td>
            <td>${item.temperature}°C</td>
            <td>${item.humidity}%</td>
            <td>${item.signal} dBm</td>
            <td class="${item.status === 'OK' ? 'good' : item.status === 'WARNING' ? 'warn' : 'bad'}">${item.status}</td>
          `;
          tableBody.appendChild(row);
        });
      }

      function updateDashboard(data) {
        const temp = Number(data.temperature ?? 0);
        const humidity = Number(data.humidity ?? 0);
        const signal = Number(data.signal ?? 0);
        const status = signal < -80 ? 'WARNING' : 'OK';

        temperatureEl.textContent = `${temp.toFixed(1)}°C`;
        humidityEl.textContent = `${humidity.toFixed(1)}%`;
        signalEl.textContent = `${signal.toFixed(0)} dBm`;
        deviceStatusEl.textContent = status;
        deviceStatusEl.className = 'value small';
        deviceStatusEl.classList.add(status === 'OK' ? 'good' : 'warn');

        const payload = {
          temperature: temp,
          humidity: humidity,
          signal: signal,
          status,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
        };

        history.push(payload);
        if (history.length > 20) history.shift();

        renderTable();
        drawChart();
      }

      function connectWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        const wsUrl = `${protocol}://${window.location.hostname}:8080`;

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          setConnectionState(true);
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            updateDashboard(data);
          } catch (err) {
            console.error('Invalid WS payload', err);
          }
        };

        ws.onclose = () => {
          setConnectionState(false);
          setTimeout(connectWebSocket, 3000);
        };

        ws.onerror = () => {
          setConnectionState(false);
        };
      }

      async function loadDemoData() {
        const demo = [
          { temperature: 27.1, humidity: 55.2, signal: -68 },
          { temperature: 27.4, humidity: 54.7, signal: -70 },
          { temperature: 28.1, humidity: 56.0, signal: -72 },
          { temperature: 28.6, humidity: 57.1, signal: -74 },
          { temperature: 29.0, humidity: 58.4, signal: -78 },
          { temperature: 28.8, humidity: 57.9, signal: -76 },
          { temperature: 28.3, humidity: 56.6, signal: -75 },
          { temperature: 28.0, humidity: 55.8, signal: -73 }
        ];

        demo.forEach((item, index) => {
          setTimeout(() => updateDashboard(item), index * 400);
        });
      }

      loadDemoData();
      connectWebSocket();
    </script>
  </body>
</html>
